<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mates para Mati</title>
<style>
:root{--p:#4f46e5;--pd:#4338ca;--ok:#16a34a;--bad:#dc2626;--t:#1e293b;--m:#64748b;--b:#e2e8f0;--bg:#eef2ff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#eef2ff,#e0f2fe);color:var(--t);min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:22px 14px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--m);margin:0 0 20px;font-size:.95rem}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.08);margin-bottom:14px}
.temas{display:grid;gap:12px}
.tema{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px;border:2px solid var(--b);border-radius:14px;background:#fff;cursor:pointer;font-size:1rem;transition:.15s}
.tema:hover{border-color:var(--p);background:#f5f3ff;transform:translateY(-2px)}
.tema .ico{font-size:2rem;line-height:1}
.tema b{display:block;font-size:1.08rem}
.tema span{color:var(--m);font-size:.85rem}
.tema .info{display:block;color:#475569;margin-top:3px}
.racha{color:#ea580c;font-weight:800}
.chip{color:var(--m);margin:-6px 0 6px}
.prog{display:flex;gap:5px;margin-bottom:14px}
.pt{flex:1;height:8px;border-radius:4px;background:#dbe3ef}
.pt.ok{background:var(--ok)}.pt.bad{background:var(--bad)}.pt.now{background:var(--p)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:.85rem;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.meta .clock{font-weight:700;color:var(--p);font-variant-numeric:tabular-nums}
.q{font-size:1.5rem;line-height:1.7;background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:14px;text-align:center;font-weight:700;letter-spacing:.5px}
.opts{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:center;width:100%;padding:13px 15px;border:2px solid var(--b);border-radius:12px;background:#fff;font-size:1.1rem;text-align:left;cursor:pointer;transition:.12s;color:var(--t);font-family:inherit;font-weight:600}
.op:hover:not(:disabled){border-color:var(--p);background:#f5f3ff}
.op:disabled{cursor:default;opacity:.75}
.op .l{width:26px;height:26px;border-radius:8px;background:#f1f5f9;display:grid;place-items:center;font-weight:700;color:var(--m);flex:none;font-size:.85rem}
.op.right{border-color:var(--ok);background:#f0fdf4;color:#14532d;opacity:1}
.op.right .l{background:var(--ok);color:#fff}
.op.wrong{border-color:var(--bad);background:#fef2f2;color:#7f1d1d;text-decoration:line-through}
.op.wrong .l{background:var(--bad);color:#fff}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;background:#f8fafc;border:1px solid var(--b);line-height:1.6;font-size:.95rem}
.fb.good{background:#f0fdf4;border-color:#bbf7d0}
.fb.bad{background:#fef2f2;border-color:#fecaca}
.fb .t{font-weight:700;margin-bottom:6px}
.fb .t.g{color:#166534}.fb .t.b{color:#991b1b}
.acts{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:10px;border:0;background:var(--p);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--pd)}
.btn.big{padding:14px 28px;font-size:1.08rem}
.btn.ghost{background:#fff;color:var(--p);border:2px solid var(--p)}
.nota{font-size:2.4rem;font-weight:800;color:var(--p);margin:6px 0}
.tiempo{font-size:1.1rem;font-weight:700;color:var(--t)}
.rep{border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:8px;background:#fff}
.rep .ej{font-weight:600;font-size:.92rem}
.rep .sol{color:#166534;font-size:.9rem}
.rep .exp{color:var(--m);font-size:.85rem;margin-top:4px}
.foot{text-align:center;color:var(--m);font-size:.8rem;margin-top:22px}
@media(max-width:480px){h1{font-size:1.35rem}.q{font-size:1.25rem}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var choice=function(a){return a[Math.floor(Math.random()*a.length)]};
function shuffle(a){var c=a.slice();for(var i=c.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=c[i];c[i]=c[j];c[j]=t}return c}

/* ---------- SUMAS (10 niveles) ---------- */
var SU=[];
SU.push(function(){ // N1: 2 cifras sin llevar
  var aD=rnd(1,4),aU=rnd(0,8),bD=rnd(1,4),bU=rnd(0,8-aU);
  if(aD+bD>8){bD=rnd(1,8-aD)}
  var a=aD*10+aU,b=bD*10+bU,v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:"Suma por columnas: unidades "+aU+"+"+bU+"="+(aU+bU)+", decenas "+aD+"+"+bD+"="+(aD+bD)+" → <b>"+v+"</b>.",
    pi:"Empieza por las unidades (la columna de la derecha)."};
});
SU.push(function(){ // N2: 2 cifras con llevar
  var a=rnd(25,99),b=rnd(25,99),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:a+" + "+b+": suma las unidades (si pasan de 9 te llevas 1) y luego las decenas → <b>"+v+"</b>.",
    pi:"Si las unidades suman más de 9, te llevas 1 a las decenas."};
});
SU.push(function(){ // N3: 2 cifras + 2 cifras grande
  var a=rnd(55,99),b=rnd(55,99),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+1,v-1,v+10,v-2],
    ex:a+" + "+b+" = <b>"+v+"</b>. Comprueba: "+a+"+"+b+"−"+b+" = "+a+".",
    pi:"Lleva con cuidado: pueden salir casi 200."};
});
SU.push(function(){ // N4: 3 cifras
  var a=rnd(150,899),b=rnd(150,899),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:a+" + "+b+" = <b>"+v+"</b>. Suma centenas, decenas y unidades por columnas.",
    pi:"Coloca los números uno debajo del otro, alineando las unidades."};
});
SU.push(function(){ // N5: 3 cifras con doble llevar
  var a=rnd(379,899),b=rnd(379,899),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+2,v-2,v+10,v+100],
    ex:a+" + "+b+" = <b>"+v+"</b>. Aquí hay llevadas en varias columnas.",
    pi:"Ojo, hay más de una llevada."};
});
SU.push(function(){ // N6: 3 + 3 grande
  var a=rnd(600,999),b=rnd(600,999),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:a+" + "+b+" = <b>"+v+"</b>. El resultado pasa de 1000.",
    pi:"El resultado es mayor que 1000."};
});
SU.push(function(){ // N7: 4 cifras
  var a=rnd(1000,4999),b=rnd(1000,4999),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+10,v-10,v+100,v-100],
    ex:a+" + "+b+" = <b>"+v+"</b>. Suma columna a columna de derecha a izquierda.",
    pi:"Ve columna por columna y apunta las llevadas."};
});
SU.push(function(){ // N8: 3 sumandos
  var a=rnd(150,899),b=rnd(150,899),c=rnd(150,899),v=a+b+c;
  return{en:a+" + "+b+" + "+c,ok:String(v),d:[v+10,v-10,v+1,v-1],
    ex:"Suma los dos primeros y luego el tercero: ("+a+"+"+b+")+"+c+" = "+(a+b)+"+"+c+" = <b>"+v+"</b>.",
    pi:"Suma primero dos números y al resultado súmale el tercero."};
});
SU.push(function(){ // N9: 4 + 4 con llevar
  var a=rnd(2500,8999),b=rnd(2500,8999),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+100,v-100,v+10,v-10],
    ex:a+" + "+b+" = <b>"+v+"</b>. Revisa cada llevada.",
    pi:"Las llevadas están en las unidades y decenas."};
});
SU.push(function(){ // N10: 4 + 4 grande
  var a=rnd(4000,9999),b=rnd(4000,9999),v=a+b;
  return{en:a+" + "+b,ok:String(v),d:[v+100,v-100,v+1000,v-1000],
    ex:a+" + "+b+" = <b>"+v+"</b>.",
    pi:"El resultado supera los 10000. Ve despacio."};
});

/* ---------- RESTAS (permiten negativos en N7+) ---------- */
var RE=[];
function noBorrow2(){var aD=rnd(2,9),aU=rnd(1,9),bD=rnd(1,aD),bU,bDt=bD;
  if(bD===aD){bU=rnd(0,aU)}else{bU=rnd(0,9)}
  return[aD*10+aU,bDt*10+bU]}
RE.push(function(){var p=noBorrow2(),a=p[0],b=p[1],v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:a+" − "+b+": resta unidades y decenas sin pedir → <b>"+v+"</b>.",
    pi:"Resta primero las unidades."}});
RE.push(function(){var a=rnd(30,99),b=rnd(11,a-1),v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+1,v-1,v+10,a-b+2],
    ex:a+" − "+b+" = <b>"+v+"</b>. Si la cifra de arriba es menor, pide 1 a la decena.",
    pi:"¿Necesitas pedir prestado en las unidades?"}});
RE.push(function(){var a=rnd(120,499),b=rnd(50,a-1),v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+10,v-10,v+1,v-1],
    ex:a+" − "+b+" = <b>"+v+"</b>.",
    pi:"Alinea bien centenas, decenas y unidades."}});
RE.push(function(){var a=rnd(300,999),b=rnd(150,a-1),v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+10,v-10,v+100,v-100],
    ex:a+" − "+b+" = <b>"+v+"</b>.",
    pi:"Cuidado con las llevadas en cadena."}});
RE.push(function(){var a=rnd(500,999),b=rnd(200,a-1),v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:a+" − "+b+" = <b>"+v+"</b>.",
    pi:"Comprueba sumando: resultado + "+b+" debe dar "+a+"."}});
RE.push(function(){var a=rnd(600,999),b=rnd(300,a-1),v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+100,v-100,v+10,v-10],
    ex:a+" − "+b+" = <b>"+v+"</b>.",
    pi:"El resultado está entre 100 y 700."}});
RE.push(function(){var a=rnd(100,499),b=rnd(500,899),v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+1,v-1,v+10,b-a],
    ex:"Como "+a+" < "+b+", el resultado es negativo: "+a+" − "+b+" = −("+b+" − "+a+") = −"+(b-a)+" = <b>"+v+"</b>.",
    pi:"El número pequeño menos el grande da negativo."}});
RE.push(function(){var neg=Math.random()<0.5,a,b;
  if(neg){a=rnd(1000,2999);b=rnd(3000,5999)}else{a=rnd(2000,5999);b=rnd(1000,a-1)}
  var v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+100,v-100,v+10,Math.abs(v)],
    ex:a+" − "+b+" = <b>"+v+"</b>."+(v<0?" Es negativo porque "+a+" < "+b+".":""),
    pi:v<0?"Da negativo: calcula "+b+"−"+a+" y ponle el signo −.":"Resta por columnas."}});
RE.push(function(){var a=choice([3000,4000,5000,6000,7000]),b=rnd(1000,2999),v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+100,v-100,v+10,v-10],
    ex:a+" − "+b+" = <b>"+v+"</b>. Con ceros hay que pedir prestado en cadena.",
    pi:"Restar a un número redondo exige pedir prestado varias veces."}});
RE.push(function(){var neg=Math.random()<0.5,a,b;
  if(neg){a=rnd(2000,4999);b=rnd(5000,8999)}else{a=rnd(4000,9999);b=rnd(1000,3999)}
  var v=a-b;
  return{en:a+" − "+b,ok:String(v),d:[v+100,v-100,v+1000,v-1000],
    ex:a+" − "+b+" = <b>"+v+"</b>."+(v<0?" Negativo: −("+b+"−"+a+").":""),
    pi:"Nivel final: 4 cifras y posible negativo."}});

/* ---------- MULTIPLICACIONES ---------- */
var MU=[];
MU.push(function(){var a=rnd(2,9),b=rnd(2,9),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+a,v-a,v+b,v-b],
    ex:a+" × "+b+" = <b>"+v+"</b> (tabla del "+a+").",
    pi:"Piensa en la tabla del "+Math.min(a,b)+"."}});
MU.push(function(){var a=rnd(3,10),b=rnd(3,10),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+a,v-a,v+10,v-10],
    ex:a+" × "+b+" = <b>"+v+"</b>.",
    pi:"¿Te sabes la tabla del "+a+"?"}});
MU.push(function(){var v,a,b;
  if(Math.random()<0.5){a=rnd(11,19);b=rnd(2,9)}else{a=choice([11,12]);b=rnd(3,9)}
  v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+10,v-10,v+a,v-a],
    ex:a+" × "+b+" = <b>"+v+"</b>. Descompón: "+a+" = 10+"+(a-10)+", así 10×"+b+" + "+(a-10)+"×"+b+".",
    pi:"Descompón el número grande en 10 + resto."}});
MU.push(function(){var a,b;
  if(Math.random()<0.5){a=rnd(20,99);b=choice([10,100]);}else{a=rnd(11,19);b=rnd(4,9)}
  var v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+10,v-10,v+a,v+100],
    ex:a+" × "+b+" = <b>"+v+"</b>."+(b===10||b===100?" Multiplicar por "+b+" es añadir ceros.":""),
    pi:(b===10||b===100)?"Añade los ceros al final.":"Multiplica sin prisa."}});
MU.push(function(){var a=rnd(13,99),b=rnd(3,9),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+10,v-10,v+b,v-b],
    ex:a+" × "+b+": "+a+"×"+b+" = "+(Math.floor(a/10)*10)+"×"+b+" + "+(a%10)+"×"+b+" = "+(Math.floor(a/10)*10*b)+"+"+((a%10)*b)+" = <b>"+v+"</b>.",
    pi:"Separa decenas y unidades: ("+Math.floor(a/10)*10+" + "+(a%10)+") × "+b+"."}});
MU.push(function(){var a=rnd(25,99),b=rnd(4,9),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+10,v-10,v+a,v-a],
    ex:a+" × "+b+" = <b>"+v+"</b>. Lleva las decenas que sobren.",
    pi:"Multiplica unidades, apunta la llevada, luego decenas."}});
MU.push(function(){var a=rnd(12,20),b=rnd(12,20),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+20,v-20,v+10,v-10],
    ex:a+" × "+b+" = <b>"+v+"</b>. Haz "+a+"×"+(b%10)+" y "+a+"×"+(Math.floor(b/10)*10)+" y súmalos.",
    pi:"Multiplica por las unidades y por las decenas por separado."}});
MU.push(function(){var a=rnd(12,25),b=rnd(12,25),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+25,v-25,v+10,v-10],
    ex:a+" × "+b+" = <b>"+v+"</b>.",
    pi:"El resultado está cerca de "+(20*20)+"."}});
MU.push(function(){var a=rnd(16,35),b=rnd(16,35),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+35,v-35,v+10,v-10],
    ex:a+" × "+b+" = <b>"+v+"</b>. En columna: multiplica y suma con el desplazamiento.",
    pi:"Haz la multiplicación en columna con su desplazamiento."}});
MU.push(function(){var a=rnd(21,39),b=rnd(21,39),v=a*b;
  return{en:a+" × "+b,ok:String(v),d:[v+39,v-39,v+100,v-100],
    ex:a+" × "+b+" = <b>"+v+"</b>. Nivel máximo.",
    pi:"Nivel final: tómate tu tiempo."}});

/* ---------- DIVISIONES (N1-8 exactas, N9-10 con resto) ---------- */
var DI=[];
function exactDiv(dMin,dMax,qMin,qMax){var d=rnd(dMin,dMax),q=rnd(qMin,qMax);
  return{d:d,q:q,n:d*q}}
DI.push(function(){var p=exactDiv(2,5,2,9),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+2,v-2],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b> porque "+p.d+" × "+v+" = "+p.n+".",
    pi:"¿Qué número multiplicado por "+p.d+" da "+p.n+"?"}});
DI.push(function(){var p=exactDiv(3,7,3,9),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+2,v+10],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b> porque "+p.d+" × "+v+" = "+p.n+".",
    pi:"Piensa en la tabla del "+p.d+"."}});
DI.push(function(){var p=exactDiv(4,9,4,11),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+2,v-2],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b>.",
    pi:"Tabla del "+p.d+"."}});
DI.push(function(){var p=exactDiv(6,12,4,12),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+2,v-2],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b> porque "+p.d+" × "+v+" = "+p.n+".",
    pi:"Prueba multiplicando "+p.d+" por números cercanos."}});
DI.push(function(){var p=exactDiv(2,9,11,29),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b>. Divide cifra a cifra.",
    pi:"El cociente tiene dos cifras."}});
DI.push(function(){var p=exactDiv(3,9,12,29),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+2,v-2],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b> porque "+p.d+" × "+v+" = "+p.n+".",
    pi:"Empieza por las primeras cifras del dividendo."}});
DI.push(function(){var p=exactDiv(4,9,25,99),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b>. División larga de 3 cifras.",
    pi:"Haz la división larga paso a paso."}});
DI.push(function(){var p=exactDiv(6,9,35,120),v=p.q;
  return{en:p.n+" ÷ "+p.d,ok:String(v),d:[v+1,v-1,v+10,v-10],
    ex:p.n+" ÷ "+p.d+" = <b>"+v+"</b>.",
    pi:"El cociente es mayor que 30."}});
function restoStr(q,r){return q+" resto "+r}
DI.push(function(){var d=rnd(4,9),q=rnd(6,29),r=rnd(1,d-1),n=d*q+r;
  var ok=restoStr(q,r);
  return{en:n+" ÷ "+d,ok:ok,d:[restoStr(q+1,r),restoStr(q-1,r),restoStr(q,r+1),String(q)],
    ex:n+" ÷ "+d+": "+d+" × "+q+" = "+(d*q)+", sobran "+r+" → <b>"+ok+"</b>. Comprueba: "+d+"×"+q+"+"+r+" = "+n+".",
    pi:"Busca el múltiplo de "+d+" más cercano a "+n+" sin pasarte."}});
DI.push(function(){var d=rnd(5,12),q=rnd(9,29),r=rnd(1,d-1),n=d*q+r;
  var ok=restoStr(q,r);
  return{en:n+" ÷ "+d,ok:ok,d:[restoStr(q+1,r),restoStr(q,r-1),restoStr(q-1,r),String(q)],
    ex:n+" ÷ "+d+": "+d+" × "+q+" = "+(d*q)+", resto "+r+" → <b>"+ok+"</b>.",
    pi:"Nivel final: el resto siempre es menor que "+d+"."}});

/* ---------- TEMAS ---------- */
var TEMAS={
  sumas:{nombre:"Sumas",icono:"➕",desc:"De 2 cifras hasta 4 cifras y 3 sumandos",niveles:SU},
  restas:{nombre:"Restas",icono:"➖",desc:"Con llevadas y algún resultado negativo",niveles:RE},
  multis:{nombre:"Multiplicaciones",icono:"✖️",desc:"Tablas hasta 2 cifras × 2 cifras",niveles:MU},
  divis:{nombre:"Divisiones",icono:"➗",desc:"Exactas y con resto (niveles 9-10)",niveles:DI}
};

/* ---------- opciones (5 en Fácil, 6 en Medio/Difícil) ---------- */
var LETRAS=["A","B","C","D","E","F"];
function candidatos(base,dif){
  var list=[],offs=dif===3?[1,-1,2,-2,3,-3,10,-10]:[1,-1,2,-2,3,-3,10,-10,100,-100];
  for(var i=0;i<offs.length;i++)list.push(base+offs[i]);
  var s=String(base);
  if(s.length>1){ /* intercambiar cifras adyacentes: distractores tramposos */
    for(var j=0;j<s.length-1;j++){var arr=s.split(""),t=arr[j];arr[j]=arr[j+1];arr[j+1]=t;
      var sw=arr.join("");
      if(/^\d+$/.test(sw)&&parseInt(sw,10)!==base)list.push(parseInt(sw,10))}
  }
  return list
}
function withOptions(g,dif){
  var nOpt=dif===1?5:6;
  var opts=[g.ok],seen={};seen[g.ok]=1;
  var ds=g.d||[];
  for(var i=0;i<ds.length&&opts.length<nOpt;i++){var v=String(ds[i]);if(v!=null&&!seen[v]){seen[v]=1;opts.push(v)}}
  var m=String(g.ok).match(/^(-?\d+)( resto (\d+))?$/),oj=0,cands=null;
  if(m&&!m[2])cands=candidatos(parseInt(m[1],10),dif);
  while(opts.length<nOpt&&oj<400){
    var cand=null;
    if(m&&m[2]){var q=parseInt(m[1],10),r=parseInt(m[3],10);
      var k=[[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0]][oj%6];
      var nq=q+k[0],nr=r+k[1];
      if(nr>=0)cand=nq+" resto "+nr;else oj++;
    }else if(cands){cand=String(cands[oj%cands.length])}
    else{cand=g.ok+" ("+(oj+1)+")"}
    if(cand!=null&&!seen[cand]){seen[cand]=1;opts.push(cand)}
    oj++;
  }
  var orden=shuffle(opts);
  return{en:g.en,opciones:orden,correcta:orden.indexOf(g.ok),ex:g.ex||"",pi:g.pi||"",ok:g.ok};
}

/* ---------- dificultades 2 y 3: números más grandes, misma explicación ---------- */
function reescalar(g,dif){
  var m=g.en.match(/^(\d+) ([+−×÷]) (\d+)(?: ([+−×÷]) (\d+))?$/);
  if(!m)return g; /* formato inesperado: se queda como está */
  var f=dif===2?1.5:2;
  function sc(x){var v=Math.round(x*f);return v>x?v:x+1}
  var a=parseInt(m[1],10),op=m[2],b=parseInt(m[3],10),c=m[5]!=null?parseInt(m[5],10):null;
  var en,ok,ex,pi;
  if(op==="+"){
    var a2=sc(a),b2=sc(b),v=a2+b2;
    if(c!=null){var c2=sc(c);v+=c2;en=a2+" + "+b2+" + "+c2;
      ex="Suma de tres números: ("+a2+" + "+b2+") + "+c2+" = "+(a2+b2)+" + "+c2+" = <b>"+v+"</b>."}
    else{en=a2+" + "+b2;ex=a2+" + "+b2+" = <b>"+v+"</b>. Suma columna a columna y revisa las llevadas."}
    ok=String(v);pi="Suma con calma: primero las unidades y apunta las llevadas.";
  }else if(op==="−"){
    var a2=sc(a),b2=sc(b),v=a2-b2;
    en=a2+" − "+b2;ok=String(v);
    ex=a2+" − "+b2+" = <b>"+v+"</b>."+(v<0?" Es negativo porque "+a2+" < "+b2+".":" Comprueba sumando: "+v+" + "+b2+" = "+a2+".");
    pi=v<0?"Da negativo: calcula "+b2+" − "+a2+" y ponle el signo −.":"Resta por columnas, pidiendo prestado en las unidades si hace falta.";
  }else if(op==="×"){
    var a2=sc(a),b2=sc(b),v=a2*b2;
    en=a2+" × "+b2;ok=String(v);
    ex=a2+" × "+b2+" = <b>"+v+"</b>. Descompón: ("+(Math.floor(a2/10)*10)+" + "+(a2%10)+") × "+b2+".";
    pi="Multiplica por las decenas y por las unidades por separado.";
  }else{ /* ÷: se reescala el cociente para seguir siendo exacta (o con el mismo resto) */
    var d=sc(b),qm=String(g.ok).match(/^(\d+) resto (\d+)$/),r=qm?parseInt(qm[2],10):0;
    var q=sc(parseInt(g.ok,10)),n=d*q+r;
    en=n+" ÷ "+d;ok=r?q+" resto "+r:String(q);
    ex=n+" ÷ "+d+": "+d+" × "+q+" = "+(d*q)+(r?", sobran "+r:"")+" → <b>"+ok+"</b>.";
    pi=r?"El resto siempre es menor que "+d+".":"Piensa en la tabla del "+d+".";
  }
  return{en:en,ok:ok,ex:ex,pi:pi}; /* distractores nuevos y más cercanos */
}
function nuevaPregunta(tema,nivel,dif){
  var g=TEMAS[tema].niveles[nivel-1]();
  if(dif>1)g=reescalar(g,dif);
  return withOptions(g,dif);
}

/* ---------- estado por tema Y dificultad, temporizador y UI ---------- */
var app=document.getElementById("app");
var ests={},temaActual=null,difActual=1;
var DIFS={
 1:{nombre:"Fácil",estrellas:"⭐",maxFallos:2,desc:"Como hasta ahora: 5 opciones y puedes fallar 2 veces"},
 2:{nombre:"Medio",estrellas:"⭐⭐",maxFallos:1,desc:"Números más grandes, 6 opciones y 1 solo fallo = fin"},
 3:{nombre:"Difícil",estrellas:"⭐⭐⭐",maxFallos:1,desc:"Números 2 veces más grandes, distractores más parecidos, sin pista y 1 fallo = fin"}
};
function clave(t,d){return t+"_"+d}
function est(t,d){
  var k=clave(t,d);
  if(!ests[k])ests[k]={tema:t,dif:d,nivel:1,aciertos:0,fallos:[],q:null,erroresEj:0,espera:false,seg:0,running:false,empezado:false,terminado:false,superada:false,fb:null,nextBtn:null,marcas:[],racha:0,maxRacha:0,segPreg:0};
  return ests[k];
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtT(s){var m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0")}
/* un único reloj global: solo avanza el tema+dificultad en curso si está en marcha */
setInterval(function(){
  if(!temaActual)return;
  var e=est(temaActual,difActual);
  if(!e.running)return;
  e.seg++;
  var el=document.getElementById("clock");
  if(el)el.textContent="⏱ "+fmtT(e.seg);
},1000);
/* ---------- localStorage: récords, fechas de superación y rachas ---------- */
function lsGet(k){try{var v=localStorage.getItem(k);return v==null?null:v}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function bestKey(t,d){return "mati_best_"+t+"_"+d}
function getBest(t,d){var v=lsGet(bestKey(t,d));if(v==null&&d===1)v=lsGet("mati_best_"+t); /* migración de la versión anterior */
  return v==null?null:parseInt(v,10)}
function setBest(t,d,s){lsSet(bestKey(t,d),s)}
function doneKey(t,d){return "mati_done_"+t+"_"+d}
function getDone(t,d){return lsGet(doneKey(t,d))}
function setDone(t,d){lsSet(doneKey(t,d),new Date().toISOString())}
function rachaKey(t,d){return "mati_racha_"+t+"_"+d}
function getRacha(t,d){var v=lsGet(rachaKey(t,d));return v==null?0:parseInt(v,10)}
function setRacha(t,d,s){lsSet(rachaKey(t,d),s)}
function fmtFecha(iso){
  try{var f=new Date(iso);if(isNaN(f.getTime()))return iso;
    return f.toLocaleDateString("es-ES")+" a las "+f.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})
  }catch(e){return iso}
}
function pausaActual(){
  if(temaActual){var e=est(temaActual,difActual);e.running=false}
  temaActual=null;difActual=1;
}
function renderInicio(){
  pausaActual();
  var h='<h1>🧮 Mates para Mati</h1><p class="sub">Elige un tema y su <b>dificultad</b>: 10 ejercicios con dificultad ascendente. En <b>Fácil</b> puedes fallar 2 veces; en <b>Medio</b> y <b>Difícil</b> basta 1 fallo. Gana rachas 🔥 acertando seguido en menos de 1 minuto. El reloj solo corre cuando pulsas <b>▶ Comenzar</b>.</p><div class="temas">';
  for(var k in TEMAS){var t=TEMAS[k],r={sup:0,mejor:null,curso:null};
   for(var d=1;d<=3;d++){
    if(getDone(k,d))r.sup++;
    var b=getBest(k,d);
    if(b!=null&&(r.mejor==null||b<r.mejor))r.mejor=b;
    var e=ests[clave(k,d)];
    if(e&&e.empezado&&!e.terminado)r.curso=d}
   var info="🏅 "+r.sup+"/3 dificultades superadas";
   if(r.curso)info="🔄 En curso: "+DIFS[r.curso].estrellas+" "+DIFS[r.curso].nombre+" · "+info;
   if(r.mejor!=null)info+=" · 🏆 mejor: "+fmtT(r.mejor);
   h+='<button class="tema" data-accion="tema" data-tema="'+k+'"><span class="ico">'+t.icono+'</span><span><b>'+t.nombre+'</b><span class="info">'+info+'</span></span></button>'}
  h+='</div><p class="foot">Funciona sin conexión · 100% local</p>';
  app.innerHTML=h;
}
function renderDificultades(tema){
  pausaActual();
  var t=TEMAS[tema];
  var h='<h1>'+t.icono+' '+t.nombre+'</h1><p class="sub">'+t.desc+'. Cada dificultad tiene su progreso, su reloj y su récord propios.</p><div class="temas">';
  for(var d=1;d<=3;d++){
    var df=DIFS[d],e=est(tema,d),b=getBest(tema,d),dn=getDone(tema,d),br=getRacha(tema,d),info="";
    if(e.empezado&&!e.terminado)info="🔄 En curso · ejercicio "+e.nivel+"/10 · ⏱ "+fmtT(e.seg);
    else if(e.terminado)info=e.superada?"✅ Superada en esta sesión":"📈 Terminada sin superarse";
    if(dn)info+=(info?" · ":"")+"✔ Última superación: "+fmtFecha(dn);
    if(b!=null)info+=(info?" · ":"")+"🏆 mejor: "+fmtT(b);
    if(br>1)info+=(info?" · ":"")+"🔥 récord de racha: "+br;
    h+='<button class="tema" data-accion="dif" data-tema="'+tema+'" data-dif="'+d+'"><span class="ico">'+df.estrellas+'</span><span><b>'+df.nombre+'</b><span>'+df.desc+'</span><span class="info">'+(info||"Sin empezar todavía")+'</span></span></button>'}
  h+='</div><div class="acts"><button class="btn ghost" data-accion="inicio">← Cambiar de tema</button></div>';
  app.innerHTML=h;
}
function renderActs(e){
  var acts=document.querySelector(".acts");
  if(!acts)return;
  var h="";
  if(e.running)h+='<button class="btn ghost" data-accion="pausar">⏸ Pausar</button>';
  else h+='<button class="btn big" data-accion="comenzar">▶ '+(e.empezado?"Seguir":"Comenzar")+'</button>';
  if(e.nextBtn)h+='<button class="btn" data-accion="'+e.nextBtn.accion+'">'+e.nextBtn.txt+'</button>';
  h+='<button class="btn ghost" data-accion="reiniciar" title="Empezar esta dificultad desde cero">↺</button>';
  h+='<button class="btn ghost" data-accion="difs">← Otra dificultad</button>';
  acts.innerHTML=h;
}
function actualizarRacha(e){
  var el=document.getElementById("racha");
  if(!el)return;
  el.textContent=e.racha>=2?"🔥 "+e.racha:"";
}
function renderPregunta(tema,dif){
  temaActual=tema;difActual=dif;
  var e=est(tema,dif),t=TEMAS[tema],df=DIFS[dif],q=e.q;
  var dots="";for(var i=1;i<=10;i++){var c=i<e.nivel?"ok":(i===e.nivel?"now":"");
   dots+='<div class="pt '+c+'"></div>'}
  var activo=e.running&&!e.espera;
  var h='<div class="meta"><span>'+t.icono+" "+t.nombre+' <b>'+df.estrellas+'</b></span><span>Ejercicio '+e.nivel+' de 10 · Aciertos: '+e.aciertos+'</span><span class="racha" id="racha"></span><span class="clock" id="clock">⏱ '+fmtT(e.seg)+'</span></div><div class="prog">'+dots+'</div>';
  if(!e.empezado)h+='<p class="sub" style="margin:-4px 0 12px">Pulsa <b>▶ Comenzar</b> para arrancar el reloj. Mientras tanto las opciones están desactivadas.</p>';
  else if(!e.running&&!e.espera)h+='<p class="sub" style="margin:-4px 0 12px">En pausa: pulsa <b>▶ Seguir</b> para continuar.</p>';
  if(df.maxFallos===1)h+='<p class="sub" style="margin:-4px 0 12px">⚠️ Dificultad '+df.nombre+': <b>1 solo fallo</b> y termina la prueba.</p>';
  h+='<div class="card"><div class="q">'+esc(q.en).replace(/\n/g,"<br>")+'</div><div class="opts" id="opts">';
  for(var i=0;i<q.opciones.length;i++){
   h+='<button class="op" data-accion="op" data-i="'+i+'"'+(activo?"":" disabled")+'><span class="l">'+LETRAS[i]+'</span><span>'+esc(q.opciones[i])+'</span></button>'}
  h+='</div><div id="fb"></div></div>';
  h+='<div class="acts"></div>';
  app.innerHTML=h;
  for(var m=0;m<e.marcas.length;m++)marcar(e.marcas[m].i,e.marcas[m].c);
  if(e.fb)mostrarFb(e.fb.tipo,e.fb.titulo,e.fb.texto,e.fb.ex,true);
  actualizarRacha(e);
  renderActs(e);
}
function renderFinal(tema,dif){
  temaActual=tema;difActual=dif;
  var e=est(tema,dif),t=TEMAS[tema],df=DIFS[dif];
  e.running=false;
  var total=e.aciertos,nf=e.fallos.length,tm=e.seg,rec=false;
  if(e.superada){
    var b=getBest(tema,dif);
    if(b==null||tm<b){setBest(tema,dif,tm);rec=true}
    setDone(tema,dif); /* fecha y hora de la última superación */
  }
  if(e.maxRacha>getRacha(tema,dif))setRacha(tema,dif,e.maxRacha);
  var dn=e.superada?getDone(tema,dif):null;
  var h='<div class="card" style="text-align:center"><div style="font-size:2.6rem">'+(e.superada?"🎉":"📈")+'</div>';
  h+='<h2>'+(e.superada?"¡Prueba superada!":"Prueba terminada")+'</h2>';
  h+='<div class="chip">'+df.estrellas+" Dificultad "+df.nombre+'</div>';
  h+='<div class="nota">'+total+'/10</div>';
  h+='<div class="tiempo">⏱ Tiempo: '+fmtT(tm)+(rec?" · 🏆 ¡Nuevo récord!":"")+'</div>';
  if(e.maxRacha>=2)h+='<div class="tiempo racha">🔥 Mejor racha: '+e.maxRacha+' seguidas</div>';
  if(dn)h+='<div class="tiempo" style="color:var(--ok)">✔ Última superación: '+fmtFecha(dn)+'</div>';
  h+='<p class="sub">'+(e.superada?"Has acertado los 10 ejercicios.":nf===0?"Ningún fallo ¡perfecto!":"Has fallado "+nf+(nf===1?" ejercicio":" ejercicios")+". Repasa:")+'</p></div>';
  if(nf){h+='<div class="card"><b>Repaso de los errores</b><div style="height:10px"></div>';
   for(var i=0;i<e.fallos.length;i++){var f=e.fallos[i];
    h+='<div class="rep"><div class="ej">'+esc(f.en).replace(/\n/g," · ")+'</div><div class="sol">Solución correcta: '+esc(f.ok)+'</div><div class="exp">'+f.ex+'</div></div>'}
   h+='</div>'}
  h+='<div class="acts"><button class="btn" data-accion="repetir">🔁 Repetir dificultad</button>';
  h+='<button class="btn ghost" data-accion="difs">🎯 Otra dificultad</button>';
  h+='<button class="btn ghost" data-accion="inicio">🏠 Elegir otro tema</button></div>';
  app.innerHTML=h;
}
function mostrarFb(tipo,titulo,texto,ex,sinScroll){
  var fb=document.getElementById("fb");
  if(!fb)return;
  fb.innerHTML='<div class="fb '+tipo+'"><div class="t '+(tipo==="good"?"g":"b")+'">'+titulo+'</div>'+texto+(ex?'<div style="margin-top:6px;color:#475569">'+ex+'</div>':'')+'</div>';
  if(!sinScroll)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function marcar(i,clase){
  var bs=document.querySelectorAll("#opts .op");
  if(bs[i]){bs[i].classList.add(clase);bs[i].disabled=true}
}
function bloquearTodos(){var bs=document.querySelectorAll("#opts .op");for(var i=0;i<bs.length;i++)bs[i].disabled=true}
function actualizarOpciones(e){
  var activo=e.running&&!e.espera;
  var bs=document.querySelectorAll("#opts .op");
  for(var i=0;i<bs.length;i++){
   if(bs[i].classList.contains("right")||bs[i].classList.contains("wrong"))continue;
   bs[i].disabled=!activo}
}
function comenzar(){
  var e=est(temaActual,difActual);
  if(e.terminado)return;
  e.running=true;e.empezado=true;
  actualizarOpciones(e);renderActs(e);
}
function pausar(){
  var e=est(temaActual,difActual);
  e.running=false;
  actualizarOpciones(e);renderActs(e);
}
function responder(i){
  var e=est(temaActual,difActual);
  if(!e.running||e.espera)return;
  var q=e.q,df=DIFS[e.dif],dt=e.seg-e.segPreg;
  if(i===q.correcta){
   e.espera=true;
   marcar(i,"right");bloquearTodos();e.marcas.push({i:i,c:"right"});
   e.aciertos++;
   var cuenta=dt<60;
   if(cuenta){e.racha++;if(e.racha>e.maxRacha)e.maxRacha=e.racha}else e.racha=0;
   var extra=cuenta?(e.racha>=2?" 🔥 Racha de "+e.racha+" seguidas.":""):" ⏰ Tardaste más de 1 minuto: la racha se reinicia.";
   e.fb={tipo:"good",titulo:"¡Correcto!",texto:(e.erroresEj?"Resuelto al segundo intento.":"Muy bien.")+extra,ex:q.ex};
   e.nextBtn=e.nivel>=10?{txt:"🏁 Ver resultado",accion:"finalizar"}:{txt:"Siguiente ejercicio →",accion:"siguiente"};
  }else{
   e.racha=0;
   marcar(i,"wrong");e.marcas.push({i:i,c:"wrong"});
   e.erroresEj++;
   if(e.erroresEj>=df.maxFallos){
    e.espera=true;bloquearTodos();
    marcar(q.correcta,"right");e.marcas.push({i:q.correcta,c:"right"});
    e.fallos.push({en:q.en,ok:q.ok,ex:q.ex});
    e.fb={tipo:"bad",titulo:df.maxFallos===1?"Respuesta incorrecta: ¡se acabó la prueba!":"Has fallado dos veces: prueba terminada",
      texto:"La respuesta correcta era <b>"+esc(q.ok)+"</b>."+(df.maxFallos===1?" En Dificultad "+df.nombre+" basta 1 fallo.":""),ex:q.ex};
    e.nextBtn={txt:"📈 Ver resultado final",accion:"final"};
   }else{
    e.fb={tipo:"bad",titulo:"No es correcto",texto:"Elige otra opción. Pista: "+esc(q.pi||"revisa la operación."),ex:""};
   }
  }
  mostrarFb(e.fb.tipo,e.fb.titulo,e.fb.texto,e.fb.ex);
  actualizarRacha(e);
  renderActs(e);
}
function siguiente(){
  var e=est(temaActual,difActual);
  e.erroresEj=0;e.espera=false;e.fb=null;e.nextBtn=null;e.marcas=[];
  e.nivel++;
  if(e.nivel>10){finalizar(true);return}
  e.q=nuevaPregunta(temaActual,e.nivel,e.dif);
  e.segPreg=e.seg;
  renderPregunta(temaActual,e.dif);
}
function finalizar(superada){
  var e=est(temaActual,difActual);
  e.running=false;e.terminado=true;e.superada=!!superada;
  renderFinal(temaActual,e.dif);
}
function reiniciar(tema,dif){
  var e=est(tema,dif);
  e.nivel=1;e.aciertos=0;e.fallos=[];e.erroresEj=0;e.espera=false;e.seg=0;
  e.running=false;e.empezado=false;e.terminado=false;e.superada=false;
  e.fb=null;e.nextBtn=null;e.marcas=[];e.racha=0;e.maxRacha=0;e.segPreg=0;
  e.q=nuevaPregunta(tema,1,dif);
  renderPregunta(tema,dif);
}
function iniciarTema(tema,dif){
  var e=est(tema,dif);
  if(e.terminado){renderFinal(tema,dif);return}
  if(!e.q){e.q=nuevaPregunta(tema,e.nivel,dif);e.segPreg=e.seg}
  e.running=false; /* el reloj no corre hasta pulsar Comenzar */
  renderPregunta(tema,dif);
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-accion]");
  if(!el)return;
  var a=el.getAttribute("data-accion");
  if(a==="tema")renderDificultades(el.getAttribute("data-tema"));
  else if(a==="dif")iniciarTema(el.getAttribute("data-tema"),parseInt(el.getAttribute("data-dif"),10));
  else if(a==="op")responder(parseInt(el.getAttribute("data-i"),10));
  else if(a==="comenzar")comenzar();
  else if(a==="pausar")pausar();
  else if(a==="siguiente")siguiente();
  else if(a==="final")finalizar(false);
  else if(a==="finalizar")finalizar(true);
  else if(a==="repetir")reiniciar(temaActual,difActual);
  else if(a==="difs")renderDificultades(temaActual);
  else if(a==="reiniciar"){if(confirm("¿Reiniciar esta dificultad desde el principio?"))reiniciar(temaActual,difActual)}
  else if(a==="inicio")renderInicio();
});
renderInicio();
</script>
